[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."airtable-mail-relay"]
  external_node_modules = ["docx"]

[functions."proposals"]
  included_files = ["reference-library/production.json", "reference-library/sources/**", "reference-library/notices/**"]

[functions."compliance"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs"]

[functions."knowledge-worker-background"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://r.wdfl.co https://www.googletagmanager.com https://bzrcdn.openai.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://ph-files.imgix.net https://api.producthunt.com https://www.google-analytics.com https://stats.g.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net https://api.getrewardful.com https://bzr.openai.com https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://www.googleadservices.com https://challenges.cloudflare.com https://ingesteer.services-prod.nsvcs.net; frame-src https://challenges.cloudflare.com; worker-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'"

[functions."proposal-worker-background"]
  external_node_modules = ["pdfkit", "docx", "fflate"]
  included_files = ["netlify/functions/assets/DejaVuSans.ttf", "netlify/functions/assets/DejaVuSans-Bold.ttf", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[functions."customer-operations-scheduled"]
  schedule = "7,22,37,52 * * * *"

[functions."analytics-retention-scheduled"]
  schedule = "17 3 * * *"

[functions."workspace-reminders-scheduled"]
  schedule = "0 * * * *"

[[headers]]
  for = "/assets/product-film/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

# Search Console change of address (Nov 13, 2026): the old Netlify subdomain must
# 301-redirect to the custom domain, or Google refuses the move. Placed first so it
# wins over the path-only rewrites below. Deploy previews use a different host
# (deploy-preview-NN--tendercrestai.netlify.app) and are not affected.
[[redirects]]
  from = "https://tendercrestai.netlify.app/*"
  to = "https://www.tendercrestai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/compare/responsive"
  to = "/compare-responsive.html"
  status = 200
  force = true

[[redirects]]
  from = "/compare/loopio"
  to = "/compare-loopio.html"
  status = 200
  force = true

[functions."free-tools"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[functions."free-tools-worker-background"]
