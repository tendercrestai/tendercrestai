# MCP server (Streamable HTTP) and its OAuth endpoints. Status 200 rewrites
# keep the clean URLs: /mcp, /.well-known/oauth-authorization-server, /oauth/*.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp-auth"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/mcp-auth"
  status = 200
  force = true
