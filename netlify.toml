[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."airtable-mail-relay"]
  external_node_modules = ["docx"]

[functions."proposals"]
  included_files = ["reference-library/production.json", "reference-library/sources/**", "reference-library/notices/**"]

[functions."compliance"]
  ignored_node_modules = ["@napi-rs/canvas-linux-x64-musl"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs"]

[functions."knowledge-worker-background"]
  ignored_node_modules = ["@napi-rs/canvas-linux-x64-musl"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions."proposal-worker-background"]
  external_node_modules = ["pdfkit", "docx", "fflate"]
  included_files = ["netlify/functions/assets/DejaVuSans.ttf", "netlify/functions/assets/DejaVuSans-Bold.ttf", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]
