[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."airtable-mail-relay"]
  external_node_modules = ["docx"]

[functions."proposals"]
  included_files = ["reference-library/production.json", "reference-library/sources/**", "reference-library/notices/**"]

[functions."compliance"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs"]

[functions."knowledge-worker-background"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions."proposal-worker-background"]
  external_node_modules = ["pdfkit", "docx", "fflate"]
  included_files = ["netlify/functions/assets/DejaVuSans.ttf", "netlify/functions/assets/DejaVuSans-Bold.ttf", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[functions."customer-operations-scheduled"]
  schedule = "7,22,37,52 * * * *"

[functions."analytics-retention-scheduled"]
  schedule = "17 3 * * *"

[functions."workspace-reminders-scheduled"]
  schedule = "0 * * * *"

[[headers]]
  for = "/assets/product-film/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[redirects]]
  from = "/compare/responsive"
  to = "/compare-responsive.html"
  status = 200
  force = true

[[redirects]]
  from = "/compare/loopio"
  to = "/compare-loopio.html"
  status = 200
  force = true

[functions."free-tools"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[functions."free-tools-worker-background"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[functions."free-tools-maintenance"]
  external_node_modules = ["pdfjs-dist", "sax"]
  included_files = ["assets/docx-validation.mjs", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[functions."free-tools-scheduled"]
  external_node_modules = ["pdfjs-dist", "sax"]
  schedule = "41 * * * *"
  included_files = ["assets/docx-validation.mjs", "assets/compliance-export.mjs", "assets/compliance-model.mjs"]

[[redirects]]
  from = "/tools/shredder"
  to = "/shredder.html"
  status = 200
  force = true

[[redirects]]
  from = "/opportunities"
  to = "/opportunities.html"
  status = 200
  force = true

[[redirects]]
  from = "/tools/bid-check"
  to = "/bid-check.html"
  status = 200
  force = true

[[redirects]]
  from = "/teardowns"
  to = "/teardowns/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/teardowns/federal-it-services-47-requirements"
  to = "/teardowns/federal-it-services-47-requirements.html"
  status = 200
  force = true

[[redirects]]
  from = "/teardowns/state-facilities-maintenance-28-requirements"
  to = "/teardowns/state-facilities-maintenance-28-requirements.html"
  status = 200
  force = true

[[redirects]]
  from = "/teardowns/local-professional-services-19-requirements"
  to = "/teardowns/local-professional-services-19-requirements.html"
  status = 200
  force = true
