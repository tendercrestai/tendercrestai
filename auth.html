
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Login | TenderCrest AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #0f172a;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { color: #2563eb; margin-bottom: 6px; }
    h2 { margin-top: 20px; }
    p { color: #64748b; line-height: 1.5; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #e2e8f0; color: #0f172a; }
    .link {
      border: 0;
      background: none;
      color: #2563eb;
      padding: 8px;
      margin: 4px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .hidden { display: none; }
    #message {
      white-space: pre-wrap;
      margin-top: 16px;
      font-size: 14px;
    }
    #message.error { color: #b91c1c; }
    #message.success { color: #047857; }
  </style>
</head>
<body>
  <main class="card">
    <h1>TenderCrest AI</h1>
    <p>Secure customer account access</p>

    <section id="login">
      <h2>Welcome back</h2>
      <form id="loginForm">
        <label>Email
          <input id="loginEmail" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input id="loginPassword" type="password"
                 autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
      </form>
      <button class="link" data-view="forgot">Forgot password?</button>
      <button class="link" data-view="signup">Create an account</button>
    </section>

    <section id="signup" class="hidden">
      <h2>Create your account</h2>
      <form id="signupForm">
        <label>Full name
          <input id="signupName" type="text" maxlength="100"
                 autocomplete="name" required>
        </label>
        <label>Email
          <input id="signupEmail" type="email"
                 autocomplete="email" required>
        </label>
        <label>Password
          <input id="signupPassword" type="password"
                 autocomplete="new-password" minlength="12" required>
        </label>
        <p>Use at least 12 characters.</p>
        <button type="submit">Create account</button>
      </form>
      <button class="link" data-view="login">Already have an account? Log in</button>
    </section>

    <section id="forgot" class="hidden">
      <h2>Reset password</h2>
      <form id="forgotForm">
        <label>Email
          <input id="forgotEmail" type="email" required>
        </label>
        <button type="submit">Send reset email</button>
      </form>
      <button class="link" data-view="login">Back to login</button>
    </section>

    <section id="reset" class="hidden">
      <h2>Choose a new password</h2>
      <form id="resetForm">
        <label>New password
          <input id="newPassword" type="password"
                 autocomplete="new-password" minlength="12" required>
        </label>
        <button type="submit">Update password</button>
      </form>
    </section>

    <section id="account" class="hidden">
      <h2>My account</h2>
      <p id="accountEmail"></p>
      <button id="workspaceBtn">Open Proposal Workspace</button>
      <button id="logoutBtn" class="secondary">Log out</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="/">← Back to TenderCrest AI</a></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm";

    const supabase = createClient(
      "https://vfdwaqgfepvoujprtuww.supabase.co",
      "sb_publishable_7J1W7gPugOUuVnCWKpS24A_ozYw0KM3"
    );

    const $ = id => document.getElementById(id);
    const views = ["login", "signup", "forgot", "reset", "account"];
    const redirectBase = location.origin + "/auth.html";
    let recoveryMode = false;

    function show(view) {
      views.forEach(id => $(id).classList.toggle("hidden", id !== view));
      $("message").textContent = "";
      $("message").className = "";
    }

    function notify(text, error = false) {
      $("message").textContent = text;
      $("message").className = error ? "error" : "success";
    }

    async function run(form, task) {
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        await task();
      } catch (error) {
        notify(error.message || "Something went wrong.", true);
      } finally {
        button.disabled = false;
      }
    }

    document.querySelectorAll("[data-view]").forEach(button => {
      button.addEventListener("click", () => show(button.dataset.view));
    });

    $("signupForm").addEventListener("submit", e => {
      e.preventDefault();
      run(e.currentTarget, async () => {
        const { data, error } = await supabase.auth.signUp({
          email: $("signupEmail").value.trim(),
          password: $("signupPassword").value,
          options: {
            data: { full_name: $("signupName").value.trim() },
            emailRedirectTo: redirectBase
          }
        });
        if (error) throw error;
        if (data.session) {
          await showAccount(data.user);
        } else {
          notify("Check your email for a confirmation link. After confirming, return here to log in.");
        }
      });
    });

    $("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      run(e.currentTarget, async () => {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: $("loginEmail").value.trim(),
          password: $("loginPassword").value
        });
        if (error) throw error;
        await showAccount(data.user);
      });
    });

    $("forgotForm").addEventListener("submit", e => {
      e.preventDefault();
      run(e.currentTarget, async () => {
        const { error } = await supabase.auth.resetPasswordForEmail(
          $("forgotEmail").value.trim(),
          { redirectTo: redirectBase + "?mode=reset" }
        );
        if (error) throw error;
        notify("If this email is registered, you will receive a password reset link.");
      });
    });

    $("resetForm").addEventListener("submit", e => {
      e.preventDefault();
      run(e.currentTarget, async () => {
        const { error } = await supabase.auth.updateUser({
          password: $("newPassword").value
        });
        if (error) throw error;
        recoveryMode = false;
        await supabase.auth.signOut();
        show("login");
        notify("Password updated. Please log in.");
        history.replaceState(null, "", "/auth.html");
      });
    });

    async function showAccount(user) {
      if (!user) return;
      $("accountEmail").textContent = "Signed in as: " + user.email;
      show("account");
    }

    $("workspaceBtn").addEventListener("click", () => {
      location.href = "/#portal";
    });

    $("logoutBtn").addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      if (error) return notify(error.message, true);
      show("login");
    });

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryMode = true;
        show("reset");
      }
    });

    async function initialize() {
      const { data, error } = await supabase.auth.getSession();
      if (error) return notify(error.message, true);

      const params = new URLSearchParams(location.search);
      const isReset = params.get("mode") === "reset";

      if (isReset) {
        recoveryMode = true;
        if (data.session) show("reset");
        else {
          show("login");
          notify("Open the password reset link from your email, or request a new one.", true);
        }
      } else if (!recoveryMode && data.session) {
        await showAccount(data.session.user);
      } else if (!recoveryMode) {
        show("login");
      }
    }

    initialize();
  </script>
</body>
</html>
